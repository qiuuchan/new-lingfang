name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"   # 触发 publish-runtimes（B3 灌装链路）
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}   # 手动触发 desktop-e2e（IMPROVEMENT_PLAN E4）
  schedule:
    - cron: "0 19 * * *"  # nightly 03:00 (UTC+8) 跑 desktop-e2e 冒烟

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4   # 版本取自根 package.json 的 packageManager 字段

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Rust 测试防线（IMPROVEMENT_PLAN E3）：desktop 218 + installer 30 个测试此前不在
  # 任何 PR 级防线内，2026-08-23 前从未被 CI 编译过，已出现测试代码腐坏（缺 derive、
  # 字面量缺字段等）。windows-latest 是硬要求——Tauri 壳绑 windows-sys 依赖。
  rust-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      # tauri generate_context! 在编译期读 frontendDist（../dist），必须先产出前端
      - name: Build frontend (required by tauri generate_context!)
        run: pnpm -C apps/desktop vite:build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

  # E2E 冒烟（IMPROVEMENT_PLAN E2/E4）：WebView2 远程调试 + Playwright connectOverCDP
  # 驱动真实桌面壳（构建 → 启动 → 打开内置 notes → iframe 内 8 条断言）。
  # 仅 nightly / 手动触发：debug 构建分钟级，对每次 PR 太重；抓的是"单测全绿、
  # 真机第一行就挂"级别的集成缺陷（2026-08-23 A5 曾一次抓出 4 个）。
  desktop-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # runner 会话无交互桌面；桌面壳窗口仍可创建（WebView2 headless 不需要前台焦点，
      # CDP 输入事件经协议注入）。若夜跑遇到窗口站问题，在此加 RDP/virtual-display 一步。
      - name: Run desktop E2E smoke
        run: pnpm -C apps/desktop test:e2e

  publish-runtimes:
    name: Publish bundled runtimes + SFX installer (B3→C)
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality
    permissions:
      contents: write   # 创建 Release 并上传 bundle + minisign 签名附件
    env:
      LINGFANG_RUNTIME_PUBKEY: ${{ secrets.LINGFANG_RUNTIME_PUBKEY }}
      LINGFANG_RUNTIME_SIGKEY: ${{ secrets.LINGFANG_RUNTIME_SIGKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # runtime-parts 分片走 LFS；materialize 拼合 chrome.dll 需真实字节
      - uses: pnpm/action-setup@v4   # 版本取自根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install

      # ── 0. 大件预取：凡锁内带 sha256 硬门槛的归档一律走 curl 断点续传 + 重试
      #    （Node fetch 无重试、300s 超时，慢速源会被击杀）；预取后 materialize 全部命中复用分支。
      - name: Pre-fetch runtime archives (resumable)
        run: |
          mkdir -p apps/desktop/runtimes/.download
          node -e "
            const l = JSON.parse(require('fs').readFileSync('apps/desktop/runtime-lock.json', 'utf8'));
            for (const [name, rt] of Object.entries(l.runtimes)) {
              if (typeof rt.source === 'string' && rt.source.startsWith('https://') &&
                  rt.sourceSha256 && rt.sourceSha256 !== 'TODO_FETCH_AND_FILL' &&
                  Number(rt.sourceSize) > 0) {
                console.log(name + '\t' + rt.source);
              }
            }
          " | while IFS=$'\t' read -r name url; do
            echo "[pre-fetch] $name <- $url"
            curl -L --retry 8 --retry-all-errors --retry-delay 5 -C - \
              -o "apps/desktop/runtimes/.download/.$name.prefetched.tmp" "$url"
          done
        shell: bash

      # ── 1. 分片拼合 + 公开来源归档校验（sha256 硬门槛；网络件已预取）───────
      - name: Materialize runtime shards & verify fetched archives
        run: |
          if ! node scripts/materialize-bundled-runtimes.mjs 2>materialize-error.txt; then
            cat materialize-error.txt >&2
            { echo '## Materialize failure'; echo '~~~text'; cat materialize-error.txt; echo '~~~'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$(tail -3 materialize-error.txt | tr '\n' ' ')"
            exit 1
          fi
        shell: bash

      # ── 2. 灌装 runtimes/：解包 node/python/pnpm/ffmpeg/chromium ───────────
      - name: Populate runtimes (node/python/pnpm/ffmpeg/chromium)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # 黑匣子：任何失败 → 错误全文写入公开可见的 Step Summary + ::error:: 注解
          # （Actions 日志 API 需管理员权限；summary 与注解匿名可读，便于远程排障）
          trap {
            $detail = ($_ | Out-String).Trim() + "`n--- runtimes tree (depth 3) ---`n" +
              ((Get-ChildItem apps/desktop/runtimes -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                ForEach-Object FullName | Out-String))
            $detail | Set-Content populate-error.txt
            Add-Content $env:GITHUB_STEP_SUMMARY ('## Populate failure' + "`n" + '~~~' + "`n" + $detail + "`n~~~")
            $one = ($detail -replace '\s+', ' ')
            if ($one.Length -gt 3500) { $one = $one.Substring(0, 3500) }
            Write-Output "::error::$one"
            break
          }
          $lock = Get-Content apps/desktop/runtime-lock.json -Raw | ConvertFrom-Json
          $rt   = 'apps/desktop/runtimes'

          # node —— 解压 zip 并去掉顶层目录，随后把 pnpm 装进便携 prefix，
          # 使 nodejs/pnpm.cmd 与 nodejs/node_modules/pnpm/bin/pnpm.cjs 就位。
          Invoke-WebRequest $lock.runtimes.node.source -OutFile node-dist.zip
          Expand-Archive node-dist.zip -DestinationPath node-tmp -Force
          Move-Item node-tmp\* "$rt/nodejs"
          $env:PATH = "$((Resolve-Path "$rt/nodejs").Path);$env:PATH"
          & "$rt/nodejs/npm.cmd" install -g --prefix "$rt/nodejs" 'pnpm@9'
          if ($LASTEXITCODE -ne 0) { throw "pnpm install into portable node failed (exit=$LASTEXITCODE)" }

          # python —— install_only_stripped 压缩包顶层即 python/
          Invoke-WebRequest $lock.runtimes.python.source -OutFile python-dist.tar.gz
          New-Item -ItemType Directory -Force -Path "$rt/python" | Out-Null
          tar -xzf python-dist.tar.gz -C "$rt/python" --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw "python tar extract failed (exit=$LASTEXITCODE)" }

          # install_only_stripped 不带 pip 启动器（pip 包本体在 site-packages）；
          # 锁 requiredFiles 要求 python/Scripts/pip.cmd —— 补一个标准 .cmd 垫片。
          & "$rt/python/python.exe" -m pip --version *> $null
          if ($LASTEXITCODE -ne 0) {
            & "$rt/python/python.exe" -m ensurepip --upgrade *> $null
            if ($LASTEXITCODE -ne 0) { throw "python ensurepip failed (exit=$LASTEXITCODE)" }
          }
          @'
          @echo off
          "%~dp0..\python.exe" -m pip %*
          '@ | Set-Content -LiteralPath "$rt/python/Scripts/pip.cmd" -Encoding Ascii

          # ffmpeg —— 取 materialize 校验过的归档（sha256 已硬门槛），解出两个 exe
          $ffArchive = Get-ChildItem "$rt/.download" -Filter '.ffmpeg.*' |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $ffArchive) { throw 'ffmpeg archive not found in .download/' }
          New-Item -ItemType Directory -Force -Path ff-tmp, "$rt/ffmpeg" | Out-Null
          tar -xf $ffArchive.FullName -C ff-tmp
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg tar extract failed (exit=$LASTEXITCODE)" }
          Copy-Item ff-tmp/*/bin/*.exe "$rt/ffmpeg/"

          # chromium —— CfT 官方包按 ms-playwright 目录布局落位；
          # 锁内 source 已含 <browserVersion>/win64/ 路径，直接拼文件名即可。
          # chrome.dll 已由分片拼合（字节一致），此处 -Force 合并补齐其余文件与 headless shell。
          $cft = $lock.runtimes.chromium.source
          $mp  = "$rt/chromium/ms-playwright"
          New-Item -ItemType Directory -Force -Path "$mp/chromium-1228", "$mp/chromium_headless_shell-1228" | Out-Null
          Invoke-WebRequest "$cft/chrome-win64.zip" -OutFile cft-chrome.zip
          Invoke-WebRequest "$cft/chrome-headless-shell-win64.zip" -OutFile cft-hss.zip
          Expand-Archive cft-chrome.zip -DestinationPath "$mp/chromium-1228" -Force
          Expand-Archive cft-hss.zip -DestinationPath "$mp/chromium_headless_shell-1228" -Force
          Set-Content "$mp/chromium-1228/INSTALLATION_COMPLETE" ''
          Set-Content "$mp/chromium_headless_shell-1228/INSTALLATION_COMPLETE" ''

      # ── 3. 全量校验（keyFiles sha256 + Playwright 漂移）──────────────────
      - name: Verify runtimes (sha256 + Playwright drift)
        shell: pwsh
        run: |
          node scripts/verify-bundled-runtimes.mjs 2>&1 | Tee-Object -Variable verifyOut
          if ($LASTEXITCODE -ne 0) {
            ($verifyOut | Out-String) | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Output "::error::$(($verifyOut | Select-Object -Last 3) -join ' ')"
            exit 1
          }

      # ── 4. 打包 ──────────────────────────────────────────────────────
      - name: Package runtimes bundle
        run: tar -a -c -f runtimes-bundle.zip -C apps/desktop runtimes
        shell: bash

      # ── 5. minisign 签名 + 自验 ──────────────────────────────────────
      - name: Sign bundle (minisign)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile ms.zip
          Expand-Archive ms.zip -DestinationPath ms-bin
          $minisign = (Get-ChildItem ms-bin -Recurse -Filter minisign.exe |
            Where-Object FullName -match 'x86_64').FullName
          # 密钥来自 Org secret；统一为 LF 结尾写入临时文件（不入库）
          function Write-Key([string]$value, [string]$path) {
            $t = $value.Replace("`r`n", "`n")
            if (-not $t.EndsWith("`n")) { $t += "`n" }
            [IO.File]::WriteAllText($path, $t)
          }
          Write-Key $env:LINGFANG_RUNTIME_SIGKEY 'bundle.seckey'
          Write-Key $env:LINGFANG_RUNTIME_PUBKEY 'bundle.pubkey'
          & $minisign -S -s bundle.seckey -m runtimes-bundle.zip
          if ($LASTEXITCODE -ne 0) { throw 'minisign signing failed' }
          & $minisign -V -p bundle.pubkey -m runtimes-bundle.zip -x runtimes-bundle.zip.minisig
          if ($LASTEXITCODE -ne 0) { throw 'minisign self-verification failed' }

      # ── 6. 上传 Release 附件（bundle + 签名）──────────────────────────
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runtimes-bundle.zip
            runtimes-bundle.zip.minisig

      # ══ B3→C（P2）：方案 C 终态——把已校验的 runtimes/ 直接注入自制安装器 ══
      # 本 job 的 apps/desktop/runtimes 刚通过全量 sha256 校验（步骤 3），
      # build-installer.mjs 会再跑一次 runtime-lock 硬门槛后打包 SFX 安装器；
      # 安装时落地 exe 同级 runtimes/，命中 runtime_resolver 的 exe 同级分支。

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build desktop app (frontend + rust)
        shell: bash
        run: |
          pnpm -C apps/desktop vite:build   # tauri generate_context! 需要 ../dist 在编译期存在
          # 桌面壳必须经 tauri CLI 构建：CLI 注入 custom-protocol 并烘焙 dist 资产；
          # 直接 cargo build --release 会把 devUrl（localhost:1420）写进 release 产物，
          # 安装实例启动即白屏指向 dev server（LF-18 本机缺陷实录，2026-08-27）。
          pnpm -C apps/desktop exec tauri build --no-bundle
          cargo build --release -p lingfang-installer

      # 打包脚本自带 runtime-lock sha256 硬门槛（复用 verify-bundled-runtimes.mjs）
      - name: Build SFX installer (embeds verified runtimes)
        shell: bash
        run: node apps/desktop/build-installer.mjs

      - name: Sign installer (minisign)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'target/release' -Filter 'LingFang-Setup-*.exe' |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $setup) { throw 'SFX installer not found after build' }
          function Write-Key([string]$value, [string]$path) {
            $t = $value.Replace("`r`n", "`n")
            if (-not $t.EndsWith("`n")) { $t += "`n" }
            [IO.File]::WriteAllText($path, $t)
          }
          Write-Key $env:LINGFANG_RUNTIME_SIGKEY 'bundle.seckey'
          Write-Key $env:LINGFANG_RUNTIME_PUBKEY 'bundle.pubkey'
          # 复用步骤 5 下载的 ms-bin/minisign.exe（同 job 工作区仍可用）
          $minisign = (Get-ChildItem ms-bin -Recurse -Filter minisign.exe |
            Where-Object FullName -match 'x86_64').FullName
          & $minisign -S -s bundle.seckey -m $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'installer minisign signing failed' }
          & $minisign -V -p bundle.pubkey -m $setup.FullName `
            -x "$($setup.FullName).minisig"
          if ($LASTEXITCODE -ne 0) { throw 'installer minisign self-verification failed' }

      - name: Upload installer release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/LingFang-Setup-*.exe
            target/release/LingFang-Setup-*.exe.minisig
